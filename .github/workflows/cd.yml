name: CD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs: 
  build_and_deploy:
    runs-on: ubuntu-latest
    environment: fooddeliveryenv
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          registry: fooddeliveryacr.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
    
      - name: Build Docker
        run: docker build -f src/Dockerfile -t fooddeliveryacr.azurecr.io/fooddelivery-api:${{ github.sha }} .

      - name: Push Docker
        run: docker push fooddeliveryacr.azurecr.io/fooddelivery-api:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
          
      - name: Deploy to Container App
        run: |
          az containerapp update \
            --name fooddelivery-api \
            --resource-group FoodDeliveryProject \
            --image fooddeliveryacr.azurecr.io/fooddelivery-api:${{ github.sha }}
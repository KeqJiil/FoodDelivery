services:
  app:
    build:
      context: .
      dockerfile: src/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mssql:
        condition: service_healthy
      servicebus-emulator:
        condition: service_started

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    env_file:
      - .env
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  sqledge:
    image: mcr.microsoft.com/azure-sql-edge:latest
    env_file:
      - .env

  servicebus-emulator:
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    env_file:
      - .env
    environment:
      SQL_SERVER: sqledge
    ports:
      - "5672:5672"
    volumes:
      - ./docker/servicebus-emulator/Config.json:/ServiceBus_Emulator/ConfigFiles/Config.json
    depends_on:
      - sqledge

volumes:
  mssql-data: